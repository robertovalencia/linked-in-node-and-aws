services:
  sonar-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run npm run setup}
    volumes: [sonar-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sonar -d sonar]
      interval: 5s
      timeout: 3s
      retries: 30
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    mem_limit: 2g
    ports: ['127.0.0.1:9191:9000']
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    depends_on:
      sonar-db: {condition: service_healthy}
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
