name: linked-in-node-local
x-node: &node
  image: linked-in-node/backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  mem_limit: 256m
  cpus: 1
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s
x-env: &env
  JWT_SECRET: ${JWT_SECRET:?Run npm run setup}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Run npm run setup}
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8182
  NODE_ENV: development
  SEED_DEMO: 'true'
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    mem_limit: 384m
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_USER: marketplace_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INQUIRIES_DB_PASSWORD: ${INQUIRIES_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U marketplace_admin -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.0.1
    restart: unless-stopped
    mem_limit: 768m
    ports: ['127.0.0.1:19092:19092']
    environment:
      CLUSTER_ID: bG9jYWxOb2RlRGV2Q2x1cw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  identity:
    <<: *node
    environment:
      <<: *env
      SERVICE: identity
      PORT: 8181
      DB_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity
    ports: ['127.0.0.1:8181:8181']
  catalog:
    <<: *node
    environment:
      <<: *env
      SERVICE: catalog
      PORT: 8182
      DB_URL: postgresql://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
    ports: ['127.0.0.1:8182:8182']
  inquiries:
    <<: *node
    environment:
      <<: *env
      SERVICE: inquiries
      PORT: 8183
      DB_URL: postgresql://inquiries:${INQUIRIES_DB_PASSWORD}@postgres:5432/inquiries
    ports: ['127.0.0.1:8183:8183']
  notifications:
    <<: *node
    environment:
      <<: *env
      SERVICE: notifications
      PORT: 8184
      DB_URL: postgresql://notifications:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications
    ports: ['127.0.0.1:8184:8184']
  frontend:
    image: linked-in-node/frontend:local
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    ports: ['127.0.0.1:8180:8180']
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      inquiries: {condition: service_healthy}
      notifications: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:8180/health]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  kafka-data:
