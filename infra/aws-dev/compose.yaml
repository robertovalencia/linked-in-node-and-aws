name: marketplace-aws-dev
x-api: &api
  image: ${BACKEND_IMAGE:?immutable backend digest required}
  restart: unless-stopped
  init: true
  mem_limit: 256m
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
x-env: &env
  JWT_SECRET: ${JWT_SECRET:?required}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
  KAFKA_BROKERS: kafka:9092
  NODE_ENV: development
  SEED_DEMO: "true"
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?required}
      INQUIRIES_DB_PASSWORD: ${INQUIRIES_DB_PASSWORD:?required}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bootstrap -d postgres]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  kafka:
    image: apache/kafka:4.0.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MDEyMzQ1Njc4OWFiY2RlZg
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 30
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  identity:
    <<: *api
    environment:
      <<: *env
      SERVICE: identity
      PORT: 8181
      DB_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity
  catalog:
    <<: *api
    environment:
      <<: *env
      SERVICE: catalog
      PORT: 8182
      DB_URL: postgresql://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
  inquiries:
    <<: *api
    environment:
      <<: *env
      SERVICE: inquiries
      PORT: 8183
      DB_URL: postgresql://inquiries:${INQUIRIES_DB_PASSWORD}@postgres:5432/inquiries
      CATALOG_URL: http://catalog:8182
  notifications:
    <<: *api
    environment:
      <<: *env
      SERVICE: notifications
      PORT: 8184
      DB_URL: postgresql://notifications:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications
  frontend:
    image: ${FRONTEND_IMAGE:?immutable frontend digest required}
    restart: unless-stopped
    ports: [127.0.0.1:80:8180]
    depends_on: [identity, catalog, inquiries, notifications]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  postgres-data:
  kafka-data:
