# Docker's embedded DNS follows service-container IP changes after restart/recreate.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream identity_api { zone identity_api 64k; server identity:8181 resolve; }
upstream catalog_api { zone catalog_api 64k; server catalog:8182 resolve; }
upstream inquiries_api { zone inquiries_api 64k; server inquiries:8183 resolve; }
upstream notifications_api { zone notifications_api 64k; server notifications:8184 resolve; }
server {
 listen 8180;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location /api/auth { proxy_pass http://identity_api; proxy_set_header Host $host; }
 location /api/providers { proxy_pass http://catalog_api; proxy_set_header Host $host; }
 location /api/inquiries { proxy_pass http://inquiries_api; proxy_set_header Host $host; }
 location /api/notifications { proxy_pass http://notifications_api; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
