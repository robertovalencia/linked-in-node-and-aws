# Defaults use Docker DNS; ECS supplies the VPC resolver and Cloud Map hostnames.
# Restrict envsubst to the five deployment variables so nginx $host stays intact.
resolver ${DNS_RESOLVER} valid=5s ipv6=off;
resolver_timeout 3s;
upstream identity_api { zone identity_api 64k; server ${IDENTITY_UPSTREAM}:8181 resolve; }
upstream catalog_api { zone catalog_api 64k; server ${CATALOG_UPSTREAM}:8182 resolve; }
upstream inquiries_api { zone inquiries_api 64k; server ${INQUIRIES_UPSTREAM}:8183 resolve; }
upstream notifications_api { zone notifications_api 64k; server ${NOTIFICATIONS_UPSTREAM}:8184 resolve; }
server {
 listen 8180;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location /api/auth { proxy_pass http://identity_api; proxy_set_header Host $host; }
 location /api/providers { proxy_pass http://catalog_api; proxy_set_header Host $host; }
 location /api/inquiries { proxy_pass http://inquiries_api; proxy_set_header Host $host; }
 location /api/notifications { proxy_pass http://notifications_api; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
