name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix backend ci && npm --prefix frontend ci
      - run: npm run check
      - run: npm --prefix backend run test:coverage
      - run: npm --prefix frontend run test:coverage
      - run: npm --prefix backend run build && npm --prefix frontend run build
      - run: npm audit --omit=dev --audit-level=high && npm --prefix backend audit --omit=dev --audit-level=high && npm --prefix frontend audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: node scripts/acceptance.mjs http://localhost:8180 work/ci-acceptance.json
      - run: npm run test:browser
      - if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            work/ci-acceptance.json
            docs/evidence/browser-smoke.json
            docs/evidence/browser/*.png
      - if: always()
        run: docker compose down -v
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws-dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.16.6'}
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - run: terraform -chdir=../bootstrap init -backend=false -input=false && terraform -chdir=../bootstrap validate && terraform -chdir=../bootstrap test
