name: Deploy AWS dev
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to AWS after verification (false runs verification only)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: aws-dev-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm --prefix backend ci && npm --prefix frontend ci
      - run: npm run check && npm --prefix backend run test:coverage && npm --prefix frontend run test:coverage
      - run: node --test scripts/aws-deploy.test.mjs scripts/aws-release-local.test.mjs scripts/aws-ecs-publish-local.test.mjs
      - run: npm --prefix backend run build && npm --prefix frontend run build
      - run: npm --prefix backend audit --omit=dev --audit-level=high && npm --prefix frontend audit --omit=dev --audit-level=high
      - run: npm run setup && docker compose up -d --build --wait --wait-timeout 240
      - run: node scripts/acceptance.mjs http://localhost:8180 work/release-acceptance.json
      - run: python3 scripts/aws-ecs-frontend-dns-test.py --frontend-image linked-in-node/frontend:local
      - run: python3 scripts/aws-ecs-runtime-integration.py --report work/ecs-database-integration.json
      - run: python3 scripts/aws-ecs-kafka-integration.py --report work/ecs-kafka-integration.json
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.16.6'}
      - run: terraform -chdir=infra/aws-ecs-dev init -backend=false -input=false && terraform -chdir=infra/aws-ecs-dev validate && terraform -chdir=infra/aws-ecs-dev test
      - run: terraform -chdir=infra/aws-ecs-certificate init -backend=false -input=false && terraform -chdir=infra/aws-ecs-certificate validate && terraform -chdir=infra/aws-ecs-certificate test
      - name: Release application verification containers
        run: docker compose down -v
      - name: Set SonarQube Linux host prerequisites
        run: |
          if [ "$(sysctl -n vm.max_map_count)" -lt 524288 ]; then sudo sysctl -w vm.max_map_count=524288; fi
          if [ "$(sysctl -n fs.file-max)" -lt 131072 ]; then sudo sysctl -w fs.file-max=131072; fi
      - name: Verify actual source with an isolated SonarQube server
        run: node scripts/sonar-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            work/release-acceptance.json
            work/ecs-database-integration.json
            work/ecs-kafka-integration.json
            work/aws-ecs-preparation/frontend-dns.json
            work/ci-sonar/
            backend/coverage/
            frontend/coverage/
      - if: always()
        run: docker compose down -v
  deploy:
    needs: verify
    if: inputs.deploy == true
    environment: dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_SECRET_ARN: ${{ vars.AWS_SECRET_ARN }}
      BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable source images
        run: |
          test -n "$BACKEND_REPOSITORY" && test -n "$FRONTEND_REPOSITORY"
          for app in backend frontend; do
            repo_var="${app^^}_REPOSITORY"
            repo="${!repo_var}"
            digest=$(aws ecr batch-get-image --repository-name "${repo#*/}" --image-ids "imageTag=$GITHUB_SHA" --query 'images[0].imageId.imageDigest' --output text)
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              docker buildx build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --push --tag "$repo:$GITHUB_SHA" "$app"
              digest=$(aws ecr batch-get-image --repository-name "${repo#*/}" --image-ids "imageTag=$GITHUB_SHA" --query 'images[0].imageId.imageDigest' --output text)
            fi
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${app^^}_IMAGE=$repo@$digest" >> "$GITHUB_ENV"
          done
      - name: Scan the actual published images
        uses: aquasecurity/setup-trivy@v0.3.1
        with: {version: v0.76.1, cache: true}
      - run: |
          mkdir -p work
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false --format json --output work/backend-image-scan.json "$BACKEND_IMAGE"
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false --format json --output work/frontend-image-scan.json "$FRONTEND_IMAGE"
      - name: Deploy exact digests and verify readiness
        run: bash scripts/aws-deploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-dev-release-evidence
          path: |
            work/*-image-scan.json
            work/release-manifest.json
            work/aws-ssm-command.json
            work/aws-ssm-invocation.json
            work/aws-acceptance.json
