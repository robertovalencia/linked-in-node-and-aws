name: SonarQube quality gate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm --prefix backend ci && npm --prefix frontend ci
      - run: npm --prefix backend run test:coverage && npm --prefix frontend run test:coverage
      - name: Require configured server
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_HOST_URL" && test -n "$SONAR_TOKEN"
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
